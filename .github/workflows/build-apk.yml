name: NUVA APK Mobile Build

on:
  push:
    branches: [main, "arena/**"]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

# One build per ref; a new push cancels the stale run.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

# Needed to publish build artifacts (APK + report) back to the branch.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Ensure Android SDK components
        run: |
          set -e
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Install Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
          /tmp/gradle-8.9/bin/gradle --version

      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          cd android
          gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace 2>&1 | tee ../build.log

      - name: Collect artifacts and publish back to the branch
        if: always()
        run: |
          set -e
          mkdir -p artifacts
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          BUILD_STATUS="FAILED (no APK produced)"
          if [ -f "$APK" ]; then
            cp "$APK" artifacts/nuva-debug.apk
            sha256sum artifacts/nuva-debug.apk | awk '{print $1"  nuva-debug.apk"}' > artifacts/nuva-debug.apk.sha256
            BUILD_STATUS="OK"
          fi

          TESTS_LINE="$(python3 -c "
import glob, xml.etree.ElementTree as ET
t=f=e=s=0
files=glob.glob('android/app/build/test-results/testDebugUnitTest/*.xml')
for x in files:
    r=ET.parse(x).getroot()
    t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
print('suites=%d tests=%d failures=%d errors=%d skipped=%d' % (len(files),t,f,e,s))
" || echo 'no test results found')"

          {
            echo "NUVA Android build report"
            echo "========================"
            echo "run:        ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "commit:     ${GITHUB_SHA}"
            echo "apk:        ${BUILD_STATUS}"
            echo "built_at:   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "Unit tests: ${TESTS_LINE}"
            echo
            echo "Build log (last 150 lines)"
            echo "--------------------------"
            tail -n 150 build.log || true
          } > artifacts/build-report.txt

          git config user.name "nuva-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -f artifacts/nuva-debug.apk artifacts/nuva-debug.apk.sha256 artifacts/build-report.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to publish."
            exit 0
          fi
          git commit -m "ci: android build artifacts for ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}) [skip ci]"
          if ! git push origin "HEAD:${GITHUB_REF_NAME}"; then
            echo "Push rejected — rebasing on the latest branch tip and retrying once."
            git fetch origin "${GITHUB_REF_NAME}"
            if git rebase "origin/${GITHUB_REF_NAME}"; then
              git push origin "HEAD:${GITHUB_REF_NAME}"
            else
              git rebase --abort || true
              echo "Publish skipped (branch moved); artifacts remain on the run page."
            fi
          fi

      - name: Upload APK artifact (run page backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuva-apk
          if-no-files-found: ignore
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            artifacts/build-report.txt
