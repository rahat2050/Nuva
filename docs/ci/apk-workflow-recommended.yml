# RECOMMENDED GitHub Actions workflow (v1.6 pre-build audit)
#
# The live workflow (.github/workflows/build-apk.yml) cannot be updated by the
# CI token in use (push rejected: no `workflows` scope) and dispatch returns
# 403. Per instruction, permissions are NOT bypassed. The human maintainer
# should replace the live file with this one (same path) — then it runs on
# push/PR/manual and uses the GRADLE WRAPPER, runs unit tests + lint, verifies
# the APK exists before uploading, and fails loudly otherwise.
#
# Why the extra "Generate Gradle wrapper" step: the repo intentionally does not
# commit gradle/wrapper/gradle-wrapper.jar (binary). This step materializes the
# wrapper (pinned to 8.9 = the wrapper.properties version) so every later step
# uses ./gradlew, per the build policy. If you prefer a committed jar, run
# `gradle wrapper --gradle-version 8.9` locally once and commit it — then
# delete this step.

name: NUVA APK Mobile Build

on:
  workflow_dispatch:
  push:
    branches: ["**"]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/build-apk.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx3g"

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (platform 35 + build-tools 35.0.0)
        run: |
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -L --fail -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Generate Gradle wrapper (jar not committed by policy)
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle -p android wrapper --gradle-version 8.9 --no-daemon
          ls -la android/gradle/wrapper/gradle-wrapper.jar

      - name: Unit tests (parser, validator, security, context, screen model…)
        run: ./gradlew -p android :app:testDebugUnitTest --stacktrace

      - name: Lint (debug variant)
        run: ./gradlew -p android :app:lintDebug --stacktrace

      - name: Assemble debug APK
        run: ./gradlew -p android :app:assembleDebug --stacktrace

      - name: Verify APK exists (explicit gate)
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::APK NOT PRODUCED at $APK — build must fail"
            exit 1
          fi
          ls -lh "$APK"

      - name: Upload test/lint reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nuva-reports
          path: |
            android/app/build/reports/tests/**
            android/app/build/reports/lint-results*

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuva-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
